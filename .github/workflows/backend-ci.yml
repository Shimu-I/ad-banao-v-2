name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt ruff mypy
      - name: Lint
        run: ruff check backend
      - name: Type check (reported, not blocking yet)
        run: mypy
        continue-on-error: true
      - name: Tests
        run: python -m pytest -ra

  end-to-end:
    # Starts the real API and the pages, then drives them like a user (API checks and a browser).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt playwright
          playwright install --with-deps chromium
      - name: Create the tables with migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
        run: alembic upgrade head
      - name: Start the API and the pages
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          UPLOAD_DIR: ./e2e-uploads
          ADMIN_EMAILS: admin@demo.adbanao.test=banao-demo-secret
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          (cd ../frontend && nohup python -m http.server 5173 > ../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: API smoke test
        run: python scripts/smoke_test.py http://localhost:8000
      - name: "Demo users (run twice, must be repeatable)"
        run: |
          python scripts/seed_demo.py http://localhost:8000
          python scripts/seed_demo.py http://localhost:8000
      - name: Browser test of sign up, sign in, profile, sign out
        run: python scripts/e2e_auth.py
      - name: "Admin checks (privileges, suspend, activity log, CSV)"
        run: python scripts/e2e_admin.py http://localhost:8000
      - name: Browser test of the admin page
        run: python scripts/e2e_admin_page.py
      - name: Server log (on failure)
        if: failure()
        run: cat api.log
